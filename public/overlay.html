<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active Chatter Overlay</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,system-ui,sans-serif}.card{position:relative;width:500px;height:164px;padding:13px 15px;color:#fff;border:2px solid #2563ebaa;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#071c38,#061427 70%);box-shadow:0 16px 45px #0009,0 0 28px #2563eb42,inset 0 0 28px #1d4ed81c}.card:before{content:"";position:absolute;inset:-80px auto auto -40px;width:240px;height:180px;background:#2563eb24;filter:blur(25px);transform:rotate(15deg)}.top{height:102px;display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:center;position:relative}.avatar,.spinAvatar{display:grid;place-items:center;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#133d73,#2f76ce);border:3px solid #eaf4ff;box-shadow:0 0 18px #3b82f680;font-weight:1000}.avatar{width:62px;height:62px;font-size:20px}.avatar img,.spinAvatar img{width:100%;height:100%;object-fit:cover}.meta{min-width:0}.label{margin-bottom:5px;color:#8fc4ff;font-size:10px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase}.winner{font-size:25px;line-height:1.05;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 14px #60a5fa66}.badge{align-self:start;margin-top:15px;padding:6px 9px;border:1px solid #53fc1870;border-radius:999px;background:#53fc1817;color:#53fc18;font-size:10px;font-weight:1000;box-shadow:0 0 13px #53fc1838,inset 0 0 8px #53fc181f;text-shadow:0 0 9px #53fc18a0}.bottom{height:35px;display:flex;align-items:center;justify-content:center;padding:0 3px;border-top:1px solid #ffffff1f;position:relative}.eligibility{color:#53fc18;font-size:13px;font-weight:1000;text-align:center;text-shadow:0 0 9px #53fc1870}.spinner{position:absolute;left:13px;right:13px;top:13px;height:101px;border-radius:14px;overflow:hidden;background:#020b17;border:1px solid #ffffff24;opacity:0;pointer-events:none;transition:opacity .18s;z-index:10}.spinner.active{opacity:1}.track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;will-change:transform}.spinItem{flex:0 0 166px;height:69px;margin:0 5px;padding:8px 10px;display:flex;align-items:center;gap:9px;border:1px solid #ffffff26;border-radius:13px;background:linear-gradient(135deg,#1e4e923f,#ffffff12)}.spinAvatar{width:44px;height:44px;flex:0 0 44px;font-size:13px}.spinName{min-width:0;font-size:14px;font-weight:1000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.marker{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 12px #60a5fa;z-index:3}.marker:before,.marker:after{content:"";position:absolute;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent}.marker:before{top:0;border-top:9px solid #fff}.marker:after{bottom:0;border-bottom:9px solid #fff}@keyframes pop{0%{transform:scale(.92);filter:brightness(1.8)}60%{transform:scale(1.05)}100%{transform:scale(1)}}.pop{animation:pop .6s ease-out}
.winner.waiting{text-align:center}
</style></head><body><div class="card"><div class="top"><div class="avatar" id="avatar">W</div><div class="meta"><div class="winner waiting" id="winner">Waiting to roll…</div></div><div class="badge">GIVEAWAY</div></div><div class="bottom"><div class="eligibility">🕐 MUST BE ACTIVE IN CHAT IN THE LAST 5 MINUTES</div></div><div class="spinner" id="spinner"><div class="marker"></div><div class="track" id="track"></div></div></div><script>
const socket=io(),$=id=>document.getElementById(id);let state={},rolling=false;
function initials(n){const p=String(n||'?').trim().split(/\s+/);return(p.length>1?p[0][0]+p[1][0]:p[0].slice(0,2)).toUpperCase()}function avatar(el,n,url){el.innerHTML='';if(url){const i=document.createElement('img');i.src=url;i.referrerPolicy='no-referrer';i.onerror=()=>{el.textContent=initials(n)};el.append(i)}else el.textContent=initials(n)}
function render(s){state=s;if(!rolling){if(s.lastWinner){$('winner').classList.remove('waiting');$('winner').textContent=s.lastWinner;avatar($('avatar'),s.lastWinner,s.lastWinnerAvatar)}else{$('winner').classList.add('waiting');$('winner').textContent='Waiting to roll…';avatar($('avatar'),s.channel||'W',s.channelAvatar)}}}
function build(names,details,winner,winnerAvatar){const map=new Map((details||[]).map(x=>[x.username.toLowerCase(),x]));let base=(names||[]).map(n=>map.get(n.toLowerCase())||{username:n});if(!base.length)base=[{username:'Waiting'}];let items=[];for(let i=0;i<8;i++)items=items.concat(base);items.push({username:winner,avatar:winnerAvatar});items.push(...base.slice(0,3));$('track').innerHTML='';for(const d of items){const item=document.createElement('div');item.className='spinItem';const av=document.createElement('div');av.className='spinAvatar';avatar(av,d.username,d.avatar);const name=document.createElement('div');name.className='spinName';name.textContent=d.username;item.append(av,name);$('track').append(item)}return items.length-4}
socket.on('state',render);socket.on('roll-start',d=>{rolling=true;$('spinner').classList.add('active');const wi=build(d.names,d.participantDetails,d.winner,d.winnerAvatar);const itemW=176,center=250,target=-(wi*itemW+itemW/2-center);$('track').style.transition='none';$('track').style.transform='translateX(0)';requestAnimationFrame(()=>requestAnimationFrame(()=>{$('track').style.transition=`transform ${d.durationMs}ms cubic-bezier(.12,.65,.12,1)`;$('track').style.transform=`translateX(${target}px)`}))});socket.on('roll-finish',d=>{setTimeout(()=>{$('spinner').classList.remove('active');rolling=false;$('winner').classList.remove('waiting');$('winner').textContent=d.winner;avatar($('avatar'),d.winner,d.winnerAvatar);$('avatar').classList.remove('pop');void $('avatar').offsetWidth;$('avatar').classList.add('pop')},120)});socket.on('reset-wheel',s=>{rolling=false;$('spinner').classList.remove('active');render(s)});fetch('/api/state').then(r=>r.json()).then(render);
</script></body></html>
